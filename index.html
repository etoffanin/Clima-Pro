<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima Pro | Previsão do Tempo</title>

    <link rel="stylesheet" href="./src/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <main class="app">
        <section class="weather-card">
            <header class="app-header">
                <div>
                    <span class="app-label">CLIMA PRO</span>
                    <h1>Previsão do tempo</h1>
                </div>

                <span class="status-badge">v1.1.0</span>
            </header>

            <div class="search-area">
                <input 
                    class="input-cidade" 
                    type="text"
                    name="cidade"
                    placeholder="Digite o nome da sua cidade"
                    aria-label="Digite o nome da cidade"
                    autocomplete="address-level2"
                    enterkeyhint="search"
                >

                <button class="search-button" type="button" aria-label="Buscar clima">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i> 
                </button>
            </div>

            <div class="weather-content">
                <h2 class="cidade">Tempo em...</h2>
                <p class="temp">--°C</p>

                <div class="weather-info">
                    <img class="img-previsao" alt="Ícone do clima" hidden>
                    <p class="texto-previsao">---</p>
                </div>

                <div class="details-row">
                    <p class="umidade">Umidade: --%</p>
                </div>
            </div>
        </section>
    </main>

    <script src="./src/js/script.js?v=1.1.0-fix-js"></script>

</body>
</html>
